<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>projet</title>
</head>

<body class="flex justify-center items-center h-[100vh] bg-[#494C4F]">

    <form id="forgotForm" class="w-[284px] md:w-[384px]">
        <h1 class="text-center mb-10 text-2xl font-bold text-white">RED PRODUCT</h1>
        <div class="grid cols-1 bg-white p-5">
            <h1 class="mb-7">Mot de passe oublié?</h1>
            <p class="text-[12px]">Entrez votre adresse e-mail ci-dessous et
                nous vous envoyons des instructions sur la
                façon de modifier votre mot de passe.</p>
            <input id="forgotEmail" class="border-b p-1 mb-7 w-[220px] md:w-[324px] mt-10" type="email"
                placeholder="E-mail">
            <p id="forgotMsg" class="text-sm text-green-500 hidden"></p>
            <p id="forgotErr" class="text-sm text-red-400 hidden"></p>
            <button type="submit"
                class="bg-[#494C4F] ml-2 w-[220px] md:w-[324px] border rounded p-2 mt-10 mb-5 text-2xl text-white">
                Envoyer
            </button>
        </div>
        <div class="text-center mt-5">
            <p class="text-white mt-5">Revenir à la <a class="colors" href="index.html">Connexion</a></p>
        </div>
    </form>


    <script src="front.js"></script>
    <script>

    </script>
</body>

</html>
