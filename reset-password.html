<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Réinitialisation</title>
</head>

<body class="flex justify-center items-center h-[100vh] bg-[#494C4F]">
    <form id="resetForm" class="w-[284px] md:w-[384px]">
        <h1 class="text-center mb-10 text-2xl font-bold text-white">RED PRODUCT</h1>
        <div class="bg-white p-5">
            <h1 class="mb-7">Nouveau mot de passe</h1>
            <input id="newPassword" class="border-b p-1 mb-5 w-full mt-5" type="password"
                placeholder="Nouveau mot de passe">
            <input id="confirmPassword" class="border-b p-1 mb-5 w-full" type="password"
                placeholder="Confirmer le mot de passe">
            <p id="resetMsg" class="text-sm text-green-500 hidden"></p>
            <p id="resetErr" class="text-sm text-red-400 hidden"></p>
            <button type="submit" class="bg-[#494C4F] w-full border rounded p-2 mt-5 text-xl text-white">
                Modifier
            </button>
        </div>
    </form>

    <script>
        const API = "https://hotels-backend-ogro.onrender.com/api/auth";
        const token = new URLSearchParams(window.location.search).get("token");

        document.getElementById("resetForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const password = document.getElementById("newPassword").value;
            const confirm = document.getElementById("confirmPassword").value;
            const msg = document.getElementById("resetMsg");
            const err = document.getElementById("resetErr");

            if (!password || !confirm) { err.textContent = "Remplissez tous les champs"; err.classList.remove("hidden"); return; }
            if (password !== confirm) { err.textContent = "Les mots de passe ne correspondent pas"; err.classList.remove("hidden"); return; }
            if (!token) { err.textContent = "Token invalide"; err.classList.remove("hidden"); return; }

            try {
                const res = await fetch(`${API}/reset-password/${token}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password }),
                });
                const data = await res.json();
                if (res.ok) {
                    msg.textContent = "✅ Mot de passe modifié ! Redirection...";
                    msg.classList.remove("hidden");
                    err.classList.add("hidden");
                    setTimeout(() => window.location.href = "index.html", 2000);
                } else {
                    err.textContent = "❌ " + (data.message || "Lien expiré");
                    err.classList.remove("hidden");
                }
            } catch (e) {
                err.textContent = "❌ Erreur serveur";
                err.classList.remove("hidden");
            }
        });
    </script>
</body>

</html>
