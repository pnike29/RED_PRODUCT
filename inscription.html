<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>projet</title>
</head>

<body class="flex justify-center items-center h-[100vh] bg-[#494C4F]">


    <form action="" method="post" class="w-[284px] h-[598px] md:h-[598px] md:w-[384px] lg:h-[598px] lg:w-[384px] ">
        <h1 class="text-center mb-10 text-2xl font-bold text-white">RED PRODUCT</h1>
        <div class="grid cols-1 bg-white p-5">
            <h1>Inscrivez-vous en tant que Admin</h1>
            <input id="Nom" class="border-b p-1  mt-10" type="text" name="gamil" value="" placeholder="Nom">
            <input id="Email" class="border-b p-1  mt-10" type="text" name="gamil" value="" placeholder="E-mail">
            <input id="Password" class="border-b p-1 mb-10  mt-10" type="password" name="password" value=""
                placeholder="mots de passe">
            <div>
                <input type="checkbox" name="checkbox" value="" placeholder=" ">
                <label class="ml-2" for="checkbox">Accepter les termes et la politique</label>

            </div>
            <button onclick="register()" type="button"
                class="bg-[#494C4F] border rounded p-2 mt-10 mb-5 text-white text-2xl">S'inscrire</button>

        </div>
        <div class="text-center mt-5">
            <p class="text-white mt-5">Vous avez déja un compte? <a class="colors" href="index.html">Se
                    connecter</a></p>
        </div>
    </form>
    <script src="front.js"></script>

</body>

</html>
