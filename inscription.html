<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>projet</title>
</head>

<body class="flex justify-center items-center min-h-[100vh] bg-[#494C4F]">

    <form action="" method="post" class="w-[284px] md:w-[384px]">
        <h1 class="text-center mb-10 text-2xl font-bold text-white">RED PRODUCT</h1>
        <div class="grid cols-1 bg-white p-5">
            <h1>Inscrivez-vous en tant que Admin</h1>



            <input id="nom" class="border-b p-1 w-[220px] md:w-[324px] mt-5" type="text" placeholder="Nom">
            <input id="email" class="border-b p-1 w-[220px] md:w-[324px] mt-5" type="email" placeholder="E-mail">
            <input id="password" class="border-b p-1 w-[220px] md:w-[324px] mt-5 mb-10" type="password"
                placeholder="Mot de passe">

            <div>
                <input type="checkbox" name="checkbox" value="">
                <label class="ml-2 text-[12px]">Accepter les termes et la politique</label>
            </div>

            <button onclick="register()" type="button"
                class="bg-[#494C4F] ml-2 w-[220px] md:w-[324px] border rounded p-2 mt-10 mb-5 text-white text-2xl">
                S'inscrire
            </button>
        </div>
        <div class="text-center mt-5">
            <p class="text-white mt-5">Vous avez déjà un compte? <a class="colors" href="index.html">Se connecter</a>
            </p>
        </div>
    </form>
    <script src="front.js"></script>
</body>

</html>
